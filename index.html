<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UML Maker</title>
    <meta name="description" content="Text to UML class diagrams with automatic, hand-arranged-looking layouts." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='2' fill='%23fff' stroke='%234d4d4d' stroke-width='2'/%3E%3Crect x='5' y='4' width='22' height='8' rx='2' fill='%23d5e8d4' stroke='%234d4d4d' stroke-width='2'/%3E%3Cline x1='5' y1='19' x2='27' y2='19' stroke='%234d4d4d' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script>
      try {
        const t = localStorage.getItem('uml-maker:theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <rect x="5" y="4" width="22" height="24" rx="2" fill="#fff" stroke="#4d4d4d" stroke-width="2" />
          <rect x="5" y="4" width="22" height="8" rx="2" fill="#d5e8d4" stroke="#4d4d4d" stroke-width="2" />
          <line x1="5" y1="19" x2="27" y2="19" stroke="#4d4d4d" stroke-width="2" />
        </svg>
        <span>UML Maker</span>
      </div>
      <label class="examples">
        <span class="sr-only">Load example</span>
        <select id="example">
          <option value="">Load example…</option>
          <option value="gof">Kitchen sink (23 GoF patterns)</option>
          <option value="library">Media library</option>
        </select>
      </label>
      <div class="spacer"></div>
      <div class="group" role="group" aria-label="Export">
        <button id="export-svg" title="Download SVG">SVG</button>
        <button id="export-png" title="Download PNG at 3×">PNG</button>
        <button id="export-pdf" title="Download PDF sized to the diagram">PDF</button>
        <button id="export-drawio" title="Download a draw.io file that keeps this layout">.drawio</button>
      </div>
      <button id="share" class="primary" title="Copy a link containing the diagram source">Share</button>
      <button id="theme" class="icon" title="Toggle light/dark UI" aria-label="Toggle light/dark UI">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
      </button>
    </header>
    <main class="split">
      <section class="editor-pane">
        <div id="editor"></div>
      </section>
      <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <section class="diagram-pane">
        <div class="viewport" id="viewport">
          <div class="stage" id="stage"></div>
          <div class="empty" id="empty" hidden>Type a class to get started.</div>
        </div>
        <div class="zoom">
          <button id="zoom-out" class="icon" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zoom-level" class="level" title="Reset to 100%">100%</button>
          <button id="zoom-in" class="icon" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="fit" title="Fit diagram to view">Fit</button>
        </div>
      </section>
    </main>
    <footer class="status" id="status" aria-live="polite"></footer>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
